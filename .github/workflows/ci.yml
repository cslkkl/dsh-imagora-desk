name: ci

# 只读检查：不改代码、不提交、不推送。
# 本地钩子负责「提交前自动修」，这里负责「独立环境复核」。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # 需要完整历史：dist 同步检查要 diff，索引检查要确认 commit 真实存在
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: install (frozen)
        run: pnpm install --frozen-lockfile

      - name: lint
        run: pnpm run lint

      - name: format check
        run: pnpm run format:check

      - name: typecheck
        run: pnpm run typecheck

      - name: build
        run: pnpm run build

      - name: smoke
        run: pnpm run test

      # 构建产物必须与源码同步提交：改了源码却没重建 dist，装出来的插件还是旧画布
      - name: dist 与源码同步
        run: git diff --exit-code -- dist/client.js

      # 索引里的 commit 必须指向真实提交：否则市场里点安装的是不存在的 sha
      - name: 市场索引指向真实提交
        run: pnpm run market:fresh
