url: https://github.com/cslkkl/dsh-imagora-desk
name: cslkkl/dsh-imagora-desk
category: ui
description:
  zh: '把 Imagora 的自由画布搬进 DSH：提示词卡与图片摊在一张无限画布上，连线即参考关系，出图结果自动回流成新节点。首次打开填接口地址与 API Key 即可用，不依赖本机装过 Imagora；界面用官方组件库，按键与 Imagora 一致（Ctrl+A 全选、Ctrl+Z/Y 撤销恢复、Ctrl+S 保存、Delete 删除）。'
  en: "Brings Imagora's free-form canvas to DSH: prompt cards and images laid out on one infinite canvas where an edge means a reference, and generated results flow back as new nodes. Fill in the endpoint and API Key on first open — no local Imagora install required. Uses the official UI primitives, with Imagora's key bindings (Ctrl+A select all, Ctrl+Z/Y undo/redo, Ctrl+S save, Delete remove)."
