# 本地钩子：commit 前自动修，CI 只读查。
#
# 安装（任选其一）：
#   uv tool run pre-commit install --install-hooks
#   pipx install pre-commit; pre-commit install
#
# 全部走 repo: local + language: system —— 不下载任何 hook 环境，
# 只调用项目 node_modules 里的工具与 node 自带的脚本。
# 理由：Windows 上 pre-commit 拉 Python hook 环境常被镜像卡住，
# 而本项目的检查链路本来就只有 Node 一条。

repos:
  - repo: local
    hooks:
      - id: text-hygiene
        name: 文本卫生（行尾 / 末尾换行 / 行尾空白）
        entry: node scripts/check-text-hygiene.mjs --fix
        language: system
        pass_filenames: false
        always_run: true

      - id: prettier
        name: prettier --write
        entry: node node_modules/prettier/bin/prettier.cjs --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, markdown, yaml, css]
        exclude: ^(dist/|harness/dist/|src/client/lib/|pnpm-lock\.yaml$)

      - id: eslint
        name: eslint
        entry: node node_modules/eslint/bin/eslint.js
        language: system
        types_or: [javascript, jsx, ts, tsx]
        exclude: ^(dist/|harness/dist/|src/client/lib/)

      - id: typecheck
        name: tsc --noEmit
        entry: node node_modules/typescript/bin/tsc --noEmit
        language: system
        pass_filenames: false
        files: ^(src/client/|tsconfig\.json$)

      - id: smoke-host
        name: host 接口冒烟
        entry: node scripts/smoke-host.mjs
        language: system
        pass_filenames: false
        files: ^(src/host/|scripts/smoke-host\.mjs$)

      - id: smoke-client
        name: bundle / 包名 / 插槽注册冒烟
        entry: node scripts/smoke-client.mjs
        language: system
        pass_filenames: false
        files: ^(src/client/|dist/client\.js$|package\.json$|cordis\.patch\.yml$)

      - id: market-index
        name: 市场索引格式与新鲜度
        entry: node scripts/check-market-index.mjs
        language: system
        pass_filenames: false
        files: ^(market/|package\.json$)

      - id: market-freshness
        name: 市场索引指向真实提交
        entry: node scripts/check-market-freshness.mjs
        language: system
        pass_filenames: false
        files: ^(market/index\.json$|package\.json$|src/host/|src/client/|dist/client\.js$)
