<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-imagora 渲染验收台</title>
    <style>
      /* ---------------- 宿主设计 token（照抄 DSH 的真值） ----------------
       * 插件里所有 `--im-*` 都从这些 `--dsw-*` 派生。验收台此前**一个都没定义**，
       * 于是每个 `--im-*` 都退到它自己的兜底值 —— 结果就是：
       *   1. 验收台看到的颜色不是宿主里的颜色；
       *   2. **暗色主题根本没法验**（宿主靠 body[data-ds-dark-theme] 整体翻转，
       *      我们没搬就永远是"浅色"）。
       * 值取自宿主 ui-theme 的 design-platform.css（浅色）与它同文件的
       * `body[data-ds-dark-theme]` 段（深色），静态色板 → alias 的两级引用已展开。
       * 改这里要对着宿主那份核，不要按观感调。 */
      :root {
        color-scheme: light;
        --dsw-alias-brand-primary-new-colorprimary-new-color: #4176e6;
        --dsw-alias-label-primary: #0f1115;
        --dsw-alias-label-primary-foreground: #ffffff;
        --dsw-alias-label-secondary: #61666b;
        --dsw-alias-label-tertiary: #81858c;
        --dsw-alias-bg-base: #ffffff;
        --dsw-alias-bg-layer-1: #ffffff;
        --dsw-alias-bg-layer-2: #ffffff;
        --dsw-alias-bg-module-platform: #f9fafb;
        --dsw-alias-border-l2: #0000001a;
        --dsw-alias-border-l3: #0000001f;
        --dsw-alias-interactive-bg-hover: #2631480f;
        --dsw-alias-state-error-primary: #ec1313;
        --dsw-alias-state-warn-primary: #f59e0b;
        --dsw-alias-state-success-primary: #22c55e;
        --dsw-alias-bg-mask-1: #0000003d;
        --dsw-elevation-stroke-color: var(--dsw-alias-border-l3);
        --dsw-elevation-stroke: 0 0 0 0.5px var(--dsw-elevation-stroke-color);
        --dsw-elevation-soft: var(--dsw-elevation-stroke), 0 4px 16px 0 #00000008, 0 0 24px 0 #00000008;
        --dsw-elevation-panel: var(--dsw-elevation-stroke), 0 3px 8px 0 #00000008, 0 0 16px 0 #00000005;
        --dsw-elevation-prominent: var(--dsw-elevation-stroke), 0 3px 8px 0 #0000000a, 0 0 20px 0 #0000000d;
        --dsw-font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      body[data-ds-dark-theme] {
        color-scheme: dark;
        --dsw-alias-brand-primary-new-colorprimary-new-color: #5686fe;
        --dsw-alias-label-primary: #f9fafb;
        --dsw-alias-label-primary-foreground: #0f1115;
        --dsw-alias-label-secondary: #cfd3d6;
        --dsw-alias-label-tertiary: #adb2b8;
        --dsw-alias-bg-base: #151517;
        --dsw-alias-bg-layer-1: #232324;
        --dsw-alias-bg-layer-2: #2c2c2e;
        --dsw-alias-bg-module-platform: #353638;
        --dsw-alias-border-l2: #ffffff1f;
        --dsw-alias-border-l3: #ffffff29;
        --dsw-alias-interactive-bg-hover: #ffffff14;
        --dsw-alias-state-error-primary: #f25a5a;
        --dsw-alias-state-warn-primary: #f59e0b;
        --dsw-alias-state-success-primary: #22c55e;
        --dsw-alias-bg-mask-1: #00000080;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--dsw-alias-bg-base, #f4f5f7);
        color: var(--dsw-alias-label-primary, #1b1b1b);
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      #root {
        height: 100vh;
        display: flex;
      }
      #panel {
        flex: 1;
        min-width: 0;
      }
      .boot {
        margin: auto;
        color: #666;
        font-size: 13px;
      }
      /* 宿主组件库桩的最小样式：只为让验收台的布局可读，不追求与宿主一致 */
      .stub-label {
        display: block;
        font-size: 12px;
        color: #555;
        margin-bottom: 4px;
      }
      .stub-state {
        margin-left: 8px;
        font-size: 11px;
        color: #999;
      }
      .stub-input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font: inherit;
      }
      .stub-hint {
        margin: 4px 0 0;
        font-size: 11px;
        line-height: 1.6;
        color: #999;
      }
      .stub-modal {
        display: contents;
      }
    </style>
  </head>
  <body>
    <script>
      // 暗色主题开关：`?dark=1` 给 body 挂上宿主那套属性，插件的 token 就会整体翻转。
      // 必须在上面的样式生效后、bundle 渲染前执行 —— 插件读 token 是渲染时求值的。
      // 也支持在控制台里 `document.body.toggleAttribute('data-ds-dark-theme')` 手动切。
      if (new URLSearchParams(location.search).get('dark') === '1') {
        document.body.setAttribute('data-ds-dark-theme', '')
      }
    </script>
    <div id="root"><div class="boot">正在加载画布 bundle…</div></div>
    <script src="/harness/dist/vendor.js"></script>
    <script>
      // 模拟 DSH 宿主的模块表：react / react-dom / jsx-runtime 由宿主提供
      window.__ModuleLoader__ = {
        entry: null,
        load(payload) {
          this.entry = payload
        },
      }

      // 宿主组件库的桩：这几条必须与宿主行为一致，否则验收结论不可信——
      // Button / Input 是真按钮真输入框（验收要能点、能打字），
      // Tooltip 只包一层（宿主里它是 hover 提示，不影响布局与点击），
      // Modal 在 open 时把 children 原样渲染出来。
      ;(function () {
        var h = window.React.createElement
        function passthrough(props) {
          // 宿主组件库的私有 props（variant / size / side 等）不能落到 DOM 上
          var next = {}
          Object.keys(props || {}).forEach(function (key) {
            if (key === 'variant' || key === 'size' || key === 'side' || key === 'label') return
            if (key === 'children') return
            next[key] = props[key]
          })
          return next
        }
        function Button(props) {
          return h('button', passthrough(props), props.children)
        }
        function Input(props) {
          return h('input', passthrough(props))
        }
        function Tooltip(props) {
          return props.children
        }
        function Modal(props) {
          return props.open === false ? null : h('div', { className: 'stub-modal' }, props.children)
        }
        function Nothing() {
          return null
        }
        // SettingsValueField / SettingsSecretField 在宿主里是「标签 + 输入框 + 说明」三段。
        // 返回 null 会让验收台看不到这两个字段，弹窗看起来像缺了一块 —— 桩必须与宿主同形。
        function SettingsValueField(props) {
          return h(
            'div',
            null,
            h('label', { className: 'stub-label' }, props.label),
            h('input', {
              id: props.id,
              className: 'stub-input',
              value: props.text ?? '',
              placeholder: props.placeholder,
              disabled: props.disabled,
              onChange: event => props.onEdit?.(event.target.value),
            }),
            props.hint ? h('p', { className: 'stub-hint' }, props.hint) : null,
          )
        }
        function SettingsSecretField(props) {
          return h(
            'div',
            null,
            h(
              'label',
              { className: 'stub-label' },
              props.label,
              props.stateLabel ? h('span', { className: 'stub-state' }, props.stateLabel) : null,
            ),
            h('input', {
              id: props.id,
              className: 'stub-input',
              type: 'password',
              value: props.text ?? '',
              disabled: props.disabled,
              onChange: event => props.onEdit?.(event.target.value),
            }),
            props.hint ? h('p', { className: 'stub-hint' }, props.hint) : null,
          )
        }
        window.__dshPrimitivesStub = {
          Button: Button,
          Input: Input,
          Tooltip: Tooltip,
          Modal: Modal,
          SettingsValueField: SettingsValueField,
          SettingsSecretField: SettingsSecretField,
          Toast: Nothing,
          Switch: Nothing,
          Checkbox: Nothing,
          SegmentedControl: Nothing,
          Tag: Nothing,
          Pill: Nothing,
          StateDot: Nothing,
          ShortcutKeys: Nothing,
        }
      })()
    </script>
    <script src="/dist/client.js"></script>
    <script>
      ;(function () {
        var entry = window.__ModuleLoader__.entry
        var mount = document.getElementById('root')
        if (!entry) {
          mount.textContent = 'bundle 没有调用 __ModuleLoader__.load'
          return
        }
        var exported = entry.factory(function (id) {
          if (id === 'react') return window.React
          if (id === 'react-dom') return window.ReactDOM
          if (id === 'react-dom/client') return window.ReactDOMClient
          if (id === 'react/jsx-runtime') return window.__jsxRuntime
          if (id === 'react/jsx-dev-runtime') return window.__jsxRuntime
          if (id === '@deepseek-ai/dsh-client-ui-primitives') return window.__dshPrimitivesStub
          throw new Error('未声明的外部模块：' + id)
        })
        if (!exported || typeof exported.apply !== 'function') {
          mount.textContent = 'bundle 没有导出 apply'
          return
        }
        var registered = {}
        var ctx = {
          slots: {
            inject: function (name, fn) {
              fn()
              return function () {}
            },
            register: function (options) {
              registered[options.name] = options
              return { dispose: function () {} }
            },
          },
          effect: function (fn) {
            var dispose = fn()
            return typeof dispose === 'function' ? dispose : function () {}
          },
        }
        exported.apply(ctx)
        var App = window.__dshImagoraCanvas
        if (!App) {
          mount.textContent = '没有拿到画布组件'
          return
        }
        mount.innerHTML = ''
        window.ReactDOMClient.createRoot(mount).render(window.React.createElement(App))
      })()
    </script>
  </body>
</html>
