<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>dsh-imagora 渲染验收台</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f5f7;
        color: #1b1b1b;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          'Microsoft YaHei',
          sans-serif;
      }
      #root {
        height: 100vh;
        display: flex;
      }
      #panel {
        flex: 1;
        min-width: 0;
      }
      .boot {
        margin: auto;
        color: #666;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot">正在加载画布 bundle…</div></div>
    <script src="/harness/dist/vendor.js"></script>
    <script>
      // 模拟 DSH 宿主的模块表：react / react-dom / jsx-runtime 由宿主提供
      window.__ModuleLoader__ = {
        entry: null,
        load(payload) {
          this.entry = payload
        },
      }

      // 宿主组件库的桩：这几条必须与宿主行为一致，否则验收结论不可信——
      // Button / Input 是真按钮真输入框（验收要能点、能打字），
      // Tooltip 只包一层（宿主里它是 hover 提示，不影响布局与点击），
      // Modal 在 open 时把 children 原样渲染出来。
      ;(function () {
        var h = window.React.createElement
        function passthrough(props) {
          // 宿主组件库的私有 props（variant / size / side 等）不能落到 DOM 上
          var next = {}
          Object.keys(props || {}).forEach(function (key) {
            if (key === 'variant' || key === 'size' || key === 'side' || key === 'label') return
            if (key === 'children') return
            next[key] = props[key]
          })
          return next
        }
        function Button(props) {
          return h('button', passthrough(props), props.children)
        }
        function Input(props) {
          return h('input', passthrough(props))
        }
        function Tooltip(props) {
          return props.children
        }
        function Modal(props) {
          return props.open === false ? null : h('div', { className: 'stub-modal' }, props.children)
        }
        function Nothing() {
          return null
        }
        window.__dshPrimitivesStub = {
          Button: Button,
          Input: Input,
          Tooltip: Tooltip,
          Modal: Modal,
          Toast: Nothing,
          Switch: Nothing,
          Checkbox: Nothing,
          SegmentedControl: Nothing,
          Tag: Nothing,
          Pill: Nothing,
          StateDot: Nothing,
          SettingsValueField: Nothing,
          SettingsSecretField: Nothing,
          ShortcutKeys: Nothing,
        }
      })()
    </script>
    <script src="/dist/client.js"></script>
    <script>
      ;(function () {
        var entry = window.__ModuleLoader__.entry
        var mount = document.getElementById('root')
        if (!entry) {
          mount.textContent = 'bundle 没有调用 __ModuleLoader__.load'
          return
        }
        var exported = entry.factory(function (id) {
          if (id === 'react') return window.React
          if (id === 'react-dom') return window.ReactDOM
          if (id === 'react-dom/client') return window.ReactDOMClient
          if (id === 'react/jsx-runtime') return window.__jsxRuntime
          if (id === 'react/jsx-dev-runtime') return window.__jsxRuntime
          if (id === '@deepseek-ai/dsh-client-ui-primitives') return window.__dshPrimitivesStub
          throw new Error('未声明的外部模块：' + id)
        })
        if (!exported || typeof exported.apply !== 'function') {
          mount.textContent = 'bundle 没有导出 apply'
          return
        }
        var registered = {}
        var ctx = {
          slots: {
            inject: function (name, fn) {
              fn()
              return function () {}
            },
            register: function (options) {
              registered[options.name] = options
              return { dispose: function () {} }
            },
          },
          effect: function (fn) {
            var dispose = fn()
            return typeof dispose === 'function' ? dispose : function () {}
          },
        }
        exported.apply(ctx)
        var App = window.__dshImagoraCanvas
        if (!App) {
          mount.textContent = '没有拿到画布组件'
          return
        }
        mount.innerHTML = ''
        window.ReactDOMClient.createRoot(mount).render(window.React.createElement(App))
      })()
    </script>
  </body>
</html>
